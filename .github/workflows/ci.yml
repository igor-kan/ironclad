name: CI & Containment Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Configurations & Architecture Specs
        run: |
          python3 -m json.tool configs/microvm_template.json > /dev/null
          python3 -m json.tool configs/seccomp_filter.json > /dev/null
          echo "All JSON configurations valid."

      - name: Test Escape Simulation Harness
        run: |
          bash scripts/test_escape_harness.sh
